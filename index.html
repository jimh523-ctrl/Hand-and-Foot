<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d3b2a">
<title>Hand &amp; Foot</title>
<style>
:root{--felt:#0d3b2a;--felt2:#124d37;--ink:#f4f1e6;--gold:#ffd24a;--red:#c0182b;--muted:#9bb8a8;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--felt);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#app{min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 8px)}
h1{font-size:28px;margin:18px 0 4px}
h2{font-size:18px;margin:14px 0 6px}
p{line-height:1.4;margin:6px 0}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 14px;background:var(--gold);color:#222;min-height:46px}
button.sec{background:#1d6a4c;color:var(--ink)}
button.ghost{background:transparent;border:2px solid #2d7d5c;color:var(--ink)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 40%}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
textarea{width:100%;min-height:90px;border-radius:10px;border:2px solid #2d7d5c;background:#0a2d20;color:var(--ink);padding:8px;font:12px/1.3 ui-monospace,monospace}
.qr{background:#fff;padding:10px;border-radius:12px;width:min(78vw,300px);margin:10px auto}
.qr svg{width:100%;height:auto;display:block}
.codebox{word-break:break-all;font:11px/1.3 ui-monospace,monospace;background:#0a2d20;padding:8px;border-radius:8px;max-height:70px;overflow:auto}
/* game */
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 2px}
.score b{font-size:17px}
.status{background:#0a2d20;border-radius:10px;padding:8px 10px;font-size:14px;margin:4px 0;min-height:38px;display:flex;align-items:center}
.status.mine{background:#6b4e00;color:#fff}
.panel{background:var(--felt2);border-radius:12px;padding:8px;margin:4px 0}
.panel .t{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
.melds{display:flex;flex-wrap:wrap;gap:5px;min-height:30px}
.meld{background:#f0e6c2;color:#222;border-radius:8px;padding:4px 8px;font-size:14px;border:2px solid transparent;min-width:52px;text-align:center}
.meld small{opacity:.7}
.meld.clean{background:#ffe89a;border-color:#d9a400}
.meld.dirty{background:#cfd4d6;border-color:#7b878c}
.meld.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.table{display:flex;justify-content:center;align-items:center;gap:22px;margin:6px 0}
.pile{text-align:center;font-size:12px;color:var(--muted)}
.pile .card{margin:0 auto 3px}
.pile.tap .card{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.hand{display:flex;flex-wrap:wrap;gap:4px;padding:14px 2px 4px;justify-content:center}
.card{width:42px;height:60px;border-radius:7px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;line-height:1.05;border:2px solid #cfcfcf;user-select:none;position:relative;transition:transform .08s}
.card.red{color:var(--red)}
.card .su{font-size:17px}
.card.sel{transform:translateY(-12px);border-color:var(--gold);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.card.staged{opacity:.3}
.card.wild:after{content:"W";position:absolute;top:1px;right:3px;font-size:9px;color:#1b6;}
.card.back{background:repeating-linear-gradient(45deg,#1b4f9c,#1b4f9c 4px,#163f7c 4px,#163f7c 8px);border-color:#fff;color:#fff;font-size:13px}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--felt) 22%);padding-top:14px;margin-top:auto}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 90px);background:#222;color:#fff;border:2px solid var(--bad);padding:10px 12px;border-radius:10px;z-index:9;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:8;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--felt2);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90dvh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:4px 2px;text-align:right}td:first-child,th:first-child{text-align:left}
tr.total td{border-top:1px solid #2d7d5c;font-weight:800}
video{width:100%;border-radius:12px;background:#000}
.banner{background:var(--bad);color:#222;font-weight:700;text-align:center;padding:6px;border-radius:8px;margin:4px 0}
.rules li{margin:3px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal"></div>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

        if (used.has(id)) return 'Card used twice';
        used.add(id);
        let c;
        if (top && top.id === id) c = top;
        else {
          c = P.hand.find((x) => x.id === id);
          if (!c) return 'Card not in your hand';
        }
        cards.push(c);
      }
      if (g.target == null) {
        const r = checkMeld(cards);
        if (r.err) return r.err;
        if (P.melds.some((m) => m.rank === r.rank && m.cards.length < 7)) return 'Add to your open ' + r.rank + ' meld instead';
        P.melds.push({ rank: r.rank, cards: cards.slice() });
      } else {
        const m = P.melds[g.target];
        if (!m) return 'No such meld';
        if (m.cards.length >= 7) return 'That book is complete';
        const all = m.cards.concat(cards);
        const r = checkMeld(all);
        if (r.err) return r.err;
        m.cards = all;
      }
      points += sum(cards);
    }
    P.hand = P.hand.filter((c) => !used.has(c.id));
    return { points };
  }

  function bookCounts(P) {
    let clean = 0, dirty = 0;
    for (const m of P.melds) if (m.cards.length === 7) (m.cards.some(isWild) ? dirty++ : clean++);
    return { clean, dirty };
  }
  function canGoOut(P) {
    const b = bookCounts(P);
    return b.clean >= 2 && b.dirty >= 2;
  }

  function finishRound(s, out) {
    const det = s.players.map((P, i) => {
      const laid = P.melds.reduce((a, m) => a + sum(m.cards), 0);
      const { clean, dirty } = bookCounts(P);
      const bookBonus = clean * 500 + dirty * 300;
      const red = P.red3.length * 100;
      const left = sum(P.hand) + sum(P.foot);
      const outB = out === i ? 100 : 0;
      return { laid, clean, dirty, bookBonus, red, left, outB, total: laid + bookBonus + red + outB - left };
    });
    s.history.push(det.map((d) => d.total));
    s.scores = [s.scores[0] + det[0].total, s.scores[1] + det[1].total];
    s.summary = { det, out };
    s.phase = s.round >= ROUNDS ? 'gameEnd' : 'roundEnd';
    s.msg = out == null ? 'Stock ran out - round over.' : 'Player ' + (out + 1) + ' went out!';

  }

  function act(S, p, a) {
    if (!a || !a.t) return err('Bad action');
    if (a.t === 'next') {
      if (S.phase === 'roundEnd') return ok(dealRound(clone(S)));
      return err('Round is not over');
    }
    if (S.phase !== 'draw' && S.phase !== 'play') return err('Round is over');
    if (S.turn !== p) return err("It's not your turn");
    const s = clone(S);
    const P = s.players[p];
    const minNeeded = MIN[s.round - 1];

    if (a.t === 'draw') {
      if (s.phase !== 'draw') return err('You already drew');
      if (s.stock.length < 2) return ok(finishRound(s, null));
      P.hand.push(s.stock.pop(), s.stock.pop());
      layRed3(s, p);
      s.phase = 'play';
      s.msg = 'Meld and/or discard to end your turn.';
      return ok(s);
    }

    if (a.t === 'pickup') {
      if (s.phase !== 'draw') return err('You already drew');
      const top = s.discard[s.discard.length - 1];
      if (!top) return err('The pile is empty');
      if (isWild(top) || isBlack3(top)) return err('Top card blocks the pile');
      const groups = a.groups || [];
      const g = groups.find((x) => x && Array.isArray(x.ids) && x.ids.includes(top.id));
      if (!g) return err('Use the top card in a meld');
      const frozen = s.pileFrozen || !P.melded;
      if (frozen) {
        if (g.target != null) return err('Pile is frozen: use 2 natural ' + top.r + 's from your hand in a new meld');
        const nat = g.ids.filter((id) => id !== top.id).map((id) => P.hand.find((c) => c.id === id)).filter((c) => c && !isWild(c) && c.r === top.r);
        if (nat.length < 2) return err('Pile is frozen: need 2 natural ' + top.r + 's from your hand');
      }
      s.discard.pop();
      const res = applyGroups(s, p, groups, top);
      if (typeof res === 'string') return err(res);
      if (!P.melded) {
        if (res.points < minNeeded) return err('Opening meld needs ' + minNeeded + ' points (you have ' + res.points + ')');
        P.melded = true;
      }
      P.hand.push(...s.discard);
      s.discard = [];
      s.pileFrozen = false;
      layRed3(s, p);
      s.phase = 'play';
      s.msg = 'Picked up the pile.';
      return ok(s);
    }

    if (a.t === 'meld') {
      if (s.phase !== 'play') return err('Draw first');
      const wasOnFoot = P.onFoot;
      const res = applyGroups(s, p, a.groups);
      if (typeof res === 'string') return err(res);
      if (!P.melded) {
        if (res.points < minNeeded) return err('Opening meld needs ' + minNeeded + ' points (you have ' + res.points + ')');
        P.melded = true;
      }
      if (!P.hand.length) {
        if (wasOnFoot) {
          if (!canGoOut(P)) return err('To go out you need 2 clean and 2 dirty books');
          return ok(finishRound(s, p));
        }
        takeFoot(s, p);
        s.msg = 'Hand empty - you picked up your foot!';
      }
      return ok(s);
    }

    if (a.t === 'discard') {
      if (s.phase !== 'play') return err('Draw first');
      const i = P.hand.findIndex((c) => c.id === a.id);
      if (i < 0) return err('Card not in your hand');
      const c = P.hand.splice(i, 1)[0];
      if (!P.hand.length && P.onFoot) {
        if (!canGoOut(P)) return err('To go out you need 2 clean and 2 dirty books');
        s.discard.push(c);
        return ok(finishRound(s, p));
      }
      s.discard.push(c);
      if (isWild(c)) s.pileFrozen = true;
      if (!P.hand.length) takeFoot(s, p);
      s.turn = 1 - p;
      s.phase = 'draw';
      s.msg = 'Player ' + (s.turn + 1) + "'s turn.";
      return ok(s);
    }
    return err('Unknown action');
  }

  function viewFor(S, p) {
    const me = S.players[p], op = S.players[1 - p];
    return {
      you: p,
      round: S.round,
      rounds: ROUNDS,
      min: MIN[S.round - 1],
      scores: S.scores,
      history: S.history,
      phase: S.phase,
      turn: S.turn,
      stockCount: S.stock.length,
      discardTop: S.discard[S.discard.length - 1] || null,
      discardCount: S.discard.length,
      frozen: S.pileFrozen || !me.melded,
      msg: S.msg,
      summary: S.summary,
      me: { hand: me.hand, footCount: me.foot.length, onFoot: me.onFoot, melds: me.melds, red3: me.red3, melded: me.melded },
      opp: { handCount: op.hand.length, footCount: op.foot.length, onFoot: op.onFoot, melds: op.melds, red3: op.red3, melded: op.melded },
    };
  }

  const API = { newGame, act, viewFor, makeDeck, checkMeld, canGoOut, bookCounts, pts, isWild, isRed3, isBlack3, RANK_ORDER, MIN, ROUNDS };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.HF = API;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const app = $('#app');

const RTC_CFG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const SAVE_KEY = 'handfoot_host_state_v1';

let role = null;          // 'host' | 'guest'
let state = null;         // host only: authoritative state
let view = null;          // what this phone renders
let pc = null, dc = null, connected = false;
let sel = new Set(), pending = [], pickMode = false;
let screen = 'lobby';

/* ---------- helpers ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');

}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

}

  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Long-press the code to copy'); }
  ta.remove();
}

  catch (e) { return '<p class="muted">Code too long for a QR - use Copy/Share instead.</p>'; }
}

/* ---------- scanner ---------- */
async function scanQR(onText) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { toast('Scanning not supported here - paste the code instead'); return; }
  const modal = $('#modal');
  modal.innerHTML = '<div class="overlay"><div class="sheet"><h2>Point at the other phone\'s QR</h2><video id="vid" playsinline muted></video><button class="ghost" id="scanx" style="width:100%;margin-top:10px">Cancel</button></div></div>';
  let stream, stop = false;
  const close = () => { stop = true; if (stream) stream.getTracks().forEach((t) => t.stop()); modal.innerHTML = ''; };
  $('#scanx').onclick = close;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('#vid'); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      if (stop) return;
      try { const r = await det.detect(v); if (r.length) { const txt = r[0].rawValue; close(); onText(txt); return; } } catch (e) {}
      setTimeout(loop, 250);
    };

  } catch (e) { close(); toast('Camera unavailable - paste the code instead'); }
}

/* ---------- networking ---------- */
function wireDc(ch) {
  dc = ch;
  ch.onopen = () => { connected = true; startGameScreen(); if (role === 'host') pushView(); };
  ch.onclose = () => { connected = false; if (screen === 'game') { renderGame(); toast('Connection lost'); } };
  ch.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.k === 'view' && role === 'guest') { view = m.view; renderGame(); }
    else if (m.k === 'act' && role === 'host') hostApply(1, m.a);
    else if (m.k === 'err') toast(m.msg);
  };
}
function send(o) { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function pushView() { send({ k: 'view', view: HF.viewFor(state, 1) }); }
function hostApply(p, a) {
  const r = HF.act(state, p, a);
  if (!r.ok) { if (p === 0) toast(r.err); else send({ k: 'err', msg: r.err }); return false; }
  state = r.state; save();
  view = HF.viewFor(state, 0);
  renderGame(); pushView();
  return true;
}
function doAct(a) {
  if (role === 'host') return hostApply(0, a);
  if (!connected) { toast('Not connected'); return false; }
  send({ k: 'act', a }); return true;
}

/* ---------- lobby / pairing ---------- */
function showLobby() {
  screen = 'lobby';
  let saved = null; try { saved = localStorage.getItem(SAVE_KEY); } catch (e) {}
  setScreen(`
    <h1>♠ Hand &amp; Foot ♥</h1>
    <p class="muted">Two-player game. Each phone shows only its own cards. The phones connect directly to each other - no accounts or servers.</p>
    <div class="stack">
      <button id="bHost">Host a new game</button>
      ${saved ? '<button class="sec" id="bResume">Resume saved game (host)</button>' : ''}
      <button class="sec" id="bJoin">Join a game</button>
      <button class="ghost" id="bRules">Rules used</button>
    </div>
    <p class="muted" style="margin-top:18px">Tip: both phones on the same Wi-Fi works best. Whoever hosts is Player 1.</p>`);
  $('#bHost').onclick = () => { if (saved && !confirm('Start a brand new game and discard the saved one?')) return; startHost(true); };
  if (saved) $('#bResume').onclick = () => { try { state = JSON.parse(saved); startHost(false); } catch (e) { toast('Saved game is corrupt'); } };
  $('#bJoin').onclick = startGuest;
  $('#bRules').onclick = showRules;
}
function showRules() {
  $('#modal').innerHTML = `<div class="overlay"><div class="sheet"><h2>Rules used</h2><ul class="rules" style="padding-left:18px;font-size:14px">
  <li>4 decks + 8 jokers. Each player gets a hand and a foot of 11 cards. 4 rounds.</li>
  <li>Turn: draw 2 cards (or take the discard pile), meld, then discard 1.</li>
  <li>Meld = 3-7 cards of one rank. 2s and jokers are wild: max 3 per meld and never more than naturals. 3s can't be melded.</li>
  <li>7 cards = a book. Clean (no wilds) 500, dirty 300. Books are closed at 7.</li>
  <li>Opening meld needs 50 / 90 / 120 / 150 points in rounds 1-4 (card values only).</li>
  <li>Take the pile: top card must go into a meld. If the pile is frozen (you haven't opened yet, or a wild was discarded on it) you need 2 natural matching cards from your hand. A wild or black 3 on top blocks the pile.</li>
  <li>Red 3s: laid automatically, 100 each, replaced from the stock. Black 3s are only dead cards (5 pts against you).</li>
  <li>Empty hand: you pick up your foot at once. Go out with your foot emptied and 2 clean + 2 dirty books: +100.</li>
  <li>Values: Joker 50, A and 2 = 20, 8-K = 10, 4-7 and 3 = 5. Cards left in hand/foot count against you.</li></ul>
  <button style="width:100%" onclick="document.getElementById('modal').innerHTML=''">Close</button></div></div>`;
}

async function startHost(reset) {
  role = 'host'; screen = 'host';
  if (reset || !state) { state = HF.newGame(); save(); }
  setScreen(`<h1>Host</h1><p class="muted">Step 1: let your wife scan this (or send her the code). On her phone she taps <b>Join a game</b>.</p>
    <div id="qrBox"><p>Creating code...</p></div>
    <h2>Step 2: her reply code</h2>
    <textarea id="reply" placeholder="Paste her reply code here"></textarea>
    <div class="row" style="margin-top:8px"><button class="sec" id="scanR">Scan her QR</button><button id="go">Connect</button></div>
    <button class="ghost" id="back" style="width:100%;margin-top:10px">Back</button>`);
  $('#back').onclick = () => { closePc(); showLobby(); };
  try {
    closePc();
    pc = new RTCPeerConnection(RTC_CFG);
    wireDc(pc.createDataChannel('hf'));

      <div class="row"><button class="sec" id="cp">Copy code</button><button class="sec" id="sh">Share code</button></div>`;
    $('#cp').onclick = () => copyText(code);
    $('#sh').onclick = () => { if (navigator.share) navigator.share({ text: code }).catch(() => {}); else copyText(code); };
  } catch (e) { toast('Could not create code: ' + e.message); }

    } catch (e) { toast('That code did not work: ' + e.message); }
  };
}

function startGuest() {
  role = 'guest'; screen = 'guest';
  setScreen(`<h1>Join</h1><p class="muted">Step 1: scan the host's QR, or paste the code they sent.</p>
    <textarea id="offer" placeholder="Paste host's code here"></textarea>
    <div class="row" style="margin-top:8px"><button class="sec" id="scanO">Scan host QR</button><button id="mk">Create my reply</button></div>
    <div id="replyBox"></div>

        <p class="muted">The game starts by itself once the host connects.</p>`;
      $('#cp').onclick = () => copyText(code);
      $('#sh').onclick = () => { if (navigator.share) navigator.share({ text: code }).catch(() => {}); else copyText(code); };
    } catch (e) { toast('That code did not work: ' + e.message); }

}
function closePc() { try { if (dc) dc.close(); if (pc) pc.close(); } catch (e) {} pc = null; dc = null; connected = false; }

/* ---------- game screen ---------- */
function startGameScreen() {

}
const rankIdx = (c) => HF.RANK_ORDER.indexOf(c.r);
function cardHtml(c, cls) {

}

function stagedIds() { const s = new Set(); pending.forEach((g) => g.ids.forEach((i) => s.add(i))); return s; }

  if (!view) return 0; const h = new Map(view.me.hand.map((c) => [c.id, c])); let t = 0;

  const pts = stagedPoints();
  const needOpen = !v.me.melded;
  app.innerHTML = `
    <div class="hdr"><div>Round <b>${v.round}</b>/${v.rounds} · open ${v.min}</div>
      <div class="score">You <b>${youScore}</b> · Opp <b>${oppScore}</b></div></div>
    ${status}
    <div class="panel"><div class="t"><span>Opponent: hand ${v.opp.handCount} · foot ${v.opp.footCount}${v.opp.onFoot ? ' (on foot)' : ''}</span><span>red 3s: ${v.opp.red3.length}</span></div>
      <div class="melds">${v.opp.melds.map((m, i) => meldHtml(m, i, false)).join('') || '<span class="muted">no melds yet</span>'}</div></div>
    <div class="table">
      <div class="pile" id="stock"><div class="card back">${v.stockCount}</div>stock</div>
      <div class="pile ${mine && v.phase === 'draw' && top ? 'tap' : ''}" id="disc">${top ? cardHtml(top) : '<div class="card back">-</div>'}pile ${v.discardCount}${v.frozen ? ' ❄' : ''}</div>
    </div>
    <div class="panel"><div class="t"><span>Your melds${needOpen ? ` · need ${v.min} to open` : ''}</span><span>red 3s: ${v.me.red3.length} · foot ${v.me.footCount}${v.me.onFoot ? ' (on foot)' : ''}</span></div>
      <div class="melds">${v.me.melds.map((m, i) => meldHtml(m, i, mine && m.cards.length < 7)).join('') || '<span class="muted">no melds yet</span>'}</div></div>
    ${pending.length ? `<div class="status">Staged: ${pending.length} group${pending.length > 1 ? 's' : ''} · ${pts} pts${needOpen ? ` / ${v.min}` : ''}</div>` : ''}
    <div class="hand" id="hand">${hand.map((c) => cardHtml(c, (sel.has(c.id) ? 'sel ' : '') + (staged.has(c.id) ? 'staged' : ''))).join('')}</div>
    <div class="actions">${actionsHtml(v, mine)}</div>`;
  bindGame(v, mine);
  if (v.phase === 'roundEnd' || v.phase === 'gameEnd') showSummary(v);
  else if ($('#sum')) $('#modal').innerHTML = '';
}
function actionsHtml(v, mine) {
  if (!mine) return '<div class="row"><button class="ghost" id="bRules2">Rules</button></div>';
  const n = sel.size;
  const draw = v.phase === 'draw';
  return `<div class="row">
    ${draw ? '<button id="bDraw">Draw 2</button>' : ''}
    ${draw && v.discardTop ? `<button class="sec" id="bTake">Take pile${n ? ' (+' + n + ')' : ''}</button>` : ''}
    <button class="sec" id="bStage" ${n ? '' : 'disabled'}>Stage meld (${n})</button>
    ${pending.length ? `<button class="sec" id="bLay">Lay down</button><button class="ghost" id="bClr">Clear</button>` : ''}
    ${!draw ? `<button id="bDisc" ${n === 1 ? '' : 'disabled'}>Discard</button>` : ''}
  </div>`;
}
function bindGame(v, mine) {
  const r2 = $('#bRules2'); if (r2) r2.onclick = showRules;
  $('#hand').onclick = (e) => {
    const el = e.target.closest('.card'); if (!el) return;
    const id = +el.dataset.id; if (stagedIds().has(id)) return;
    sel.has(id) ? sel.delete(id) : sel.add(id); renderGame();
  };
  if (!mine) return;
  document.querySelectorAll('.meld[data-m]').forEach((el) => {
    el.onclick = () => {
      if (!sel.size) { toast('Select cards from your hand first, then tap the meld'); return; }
      pending.push({ target: +el.dataset.m, ids: [...sel] }); sel.clear(); renderGame();
    };
  });
  const q = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
  q('#bDraw', () => { clearStage(); doAct({ t: 'draw' }); });
  q('#bTake', () => {
    const top = v.discardTop; let groups = pending.slice();
    if (sel.size) groups.unshift({ target: null, ids: [top.id, ...sel] });
    else {
      const mi = v.me.melds.findIndex((m) => m.rank === top.r && m.cards.length < 7);
      if (mi < 0) { toast('Select 2 matching cards from your hand to take the pile'); return; }
      groups.unshift({ target: mi, ids: [top.id] });
    }
    if (doAct({ t: 'pickup', groups })) clearStage();
  });
  q('#bStage', () => { pending.push({ target: null, ids: [...sel] }); sel.clear(); renderGame(); });
  q('#bClr', () => { clearStage(); renderGame(); });
  q('#bLay', () => { if (doAct({ t: 'meld', groups: pending.slice() })) clearStage(); });
  q('#bDisc', () => { const id = [...sel][0]; if (doAct({ t: 'discard', id })) clearStage(); });
}
function clearStage() { sel.clear(); pending = []; }

function showSummary(v) {
  const s = v.summary; if (!s) return;
  const me = v.you, op = 1 - me, d = s.det;
  const row = (label, a, b) => `<tr><td>${label}</td><td>${a}</td><td>${b}</td></tr>`;
  const over = v.phase === 'gameEnd';
  const diff = v.scores[me] - v.scores[op];
  $('#modal').innerHTML = `<div class="overlay" id="sum"><div class="sheet">
    <h2>${over ? (diff === 0 ? 'Tie game!' : diff > 0 ? 'You win the game! 🎉' : 'Opponent wins the game') : 'Round ' + v.round + ' complete'}</h2>
    <p class="muted">${esc(v.msg)}</p>
    <table><tr><th></th><th>You</th><th>Opp</th></tr>
      ${row('Cards melded', d[me].laid, d[op].laid)}
      ${row('Clean books (500)', d[me].clean, d[op].clean)}
      ${row('Dirty books (300)', d[me].dirty, d[op].dirty)}
      ${row('Red 3s', d[me].red, d[op].red)}
      ${row('Went out', d[me].outB, d[op].outB)}
      ${row('Cards left', '-' + d[me].left, '-' + d[op].left)}
      <tr class="total"><td>Round</td><td>${d[me].total}</td><td>${d[op].total}</td></tr>
      <tr class="total"><td>Game total</td><td>${v.scores[me]}</td><td>${v.scores[op]}</td></tr></table>
    <div class="stack">${over ? '<button id="bAgain">Back to menu</button>' : '<button id="bNext">Next round</button>'}</div></div></div>`;
  const nx = $('#bNext'); if (nx) nx.onclick = () => { $('#modal').innerHTML = ''; doAct({ t: 'next' }); };
  const ag = $('#bAgain'); if (ag) ag.onclick = () => { $('#modal').innerHTML = ''; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} closePc(); showLobby(); };
}

if (typeof window !== 'undefined') { window.__HF_TEST = { setView: (v, r) => { role = r || 'host'; view = v; connected = true; screen = 'game'; renderGame(); }, getSel: () => sel }; }
showLobby();
})();
</script>
</body>
</html>
